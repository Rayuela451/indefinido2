<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eventos en la vida de Ana Tijoux · A2</title><style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
:root{--yellow:#FADB63;--teal:#158F91;--coral:#BA4F30;--green:#6A854F;--cream:#FFF7DF;--ink:#1D1811}*{box-sizing:border-box}body{margin:0;background:var(--yellow);color:var(--ink);font-family:Nunito,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:23px 27px 30px}header{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:15px}h1{font-size:clamp(26px,3.3vw,40px);line-height:1.06;margin:4px 0 7px;font-weight:900}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--coral)}.lead{font-size:15px;margin:0}.count{border:2px solid var(--ink);border-radius:15px;background:var(--cream);padding:8px 12px;font-weight:900;white-space:nowrap}.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.group{display:contents}h2{font-size:15px;margin:0 0 8px;color:var(--coral)}.sentence{display:block;width:100%;text-align:left;font:inherit;font-weight:800;font-size:14px;line-height:1.3;border:2px solid var(--ink);background:#fff;border-radius:12px;padding:10px 12px;margin:0;min-height:85px;cursor:pointer;transition:transform .15s,background .15s}.sentence:hover{transform:translateY(-2px)}.sentence.selected{background:#DCEFCF;border-color:var(--green)}.sentence:focus-visible,button:focus-visible{outline:3px dashed var(--coral);outline-offset:2px}.arrow{color:var(--teal);font-weight:900}.target{margin-top:17px;background:var(--teal);border:4px solid var(--ink);border-radius:19px;padding:16px;box-shadow:7px 8px 0 var(--coral);color:#fff}.target h2{font-size:19px;color:var(--yellow);margin:0 0 3px}.target p{font-size:13px;margin:0 0 10px}.chosen{display:flex;flex-wrap:wrap;gap:8px;min-height:45px;align-items:center}.chip{background:var(--cream);border:2px solid var(--ink);color:var(--ink);padding:8px 10px;border-radius:10px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}.chip.correct{background:#DBEFD3;border-color:#336C37}.chip.incorrect{background:#FFE0D5;border-color:#A63D2B}.chip-status{font-weight:900;margin-right:5px}.placeholder{color:white;opacity:.82;font-weight:700}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}button.action{font:inherit;font-weight:900;padding:10px 16px;border:2px solid var(--ink);border-radius:12px;cursor:pointer;background:var(--coral);color:white}button.action.secondary{background:var(--cream);color:var(--ink)}#feedback{font-weight:800;min-height:24px}.explain{margin-top:12px;border:2px solid var(--ink);background:var(--cream);border-radius:12px;padding:12px;font-size:14px;display:none}.explain.visible{display:block}.verb{color:var(--coral);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;font-weight:900}.foot{font-size:12px;margin-top:15px;color:#55482D}.target.drag-over{outline:5px dashed var(--yellow);outline-offset:-10px}@media(max-width:700px){.groups{grid-template-columns:1fr}.wrap{padding:16px}header{align-items:start}.count{font-size:12px}.sentence{font-size:14px}}

/* Edición compacta para incrustar en Genially: 700 × 420 */
html,body{width:100%;min-height:100%;overflow-x:hidden}
.wrap{max-width:930px;padding:9px 13px 9px}
header{margin-bottom:8px;align-items:center;gap:7px}
h1{font-size:clamp(19px,2.8vw,26px);margin:1px 0 2px;line-height:1}
.eyebrow{font-size:9px;letter-spacing:.11em}.lead{font-size:11px;line-height:1.2}
.count{padding:5px 7px;font-size:10px;border-width:1.5px;border-radius:8px}
.groups{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.sentence{font-size:clamp(9px,1.47vw,11px);line-height:1.16;min-height:51px;padding:5px 7px;border-radius:8px;border-width:1.5px;font-weight:800}
.sentence:hover{transform:translateY(-1px)}
.target{margin-top:8px;padding:8px 10px 9px;border-width:2px;border-radius:11px;box-shadow:4px 4px 0 var(--coral)}
.target h2{font-size:13px;margin:0 0 6px;line-height:1.15}

@media(max-width:700px){.wrap{padding:8px 9px}.groups{grid-template-columns:repeat(4,minmax(0,1fr))}.sentence{font-size:10px;min-height:51px;padding:5px}.chosen{grid-template-columns:repeat(4,minmax(0,1fr))}header{align-items:center}.count{font-size:9px}}
@media(max-width:460px){.groups{grid-template-columns:repeat(3,minmax(0,1fr))}.chosen{grid-template-columns:repeat(2,minmax(0,1fr))}.sentence{min-height:58px;font-size:10px}}
</style></head><body><main class="wrap"><header><div><div class="eyebrow">ESPAÑOL A2 · BIOGRAFÍAS</div><h1>¿QUÉ PASÓ EN SU VIDA?</h1><p class="lead">Selecciona los acontecimientos de la vida de Ana Tijoux.</p></div><div class="count" id="count">0 seleccionadas</div></header><div class="groups" id="groups"></div><section class="target" id="target" aria-label="Eventos en la vida de Ana Tijoux"><h2>EVENTOS EN LA VIDA DE ANA TIJOUX</h2><div class="chosen" id="chosen"><span class="placeholder">Aquí aparecerán las frases seleccionadas…</span></div></section><div class="actions"><button class="action" id="check">Comprobar</button><button class="action secondary" id="reset">Reiniciar</button><span id="feedback" aria-live="polite"></span></div><div class="explain" id="explain"></div><p class="foot">¿Qué tienen en común los verbos de los acontecimientos seleccionados?</p></main><script>
const groups=[{label:'',items:[{t:'Ana nació en Francia en 1977.',ok:true,marked:'Ana <span class="verb">nació</span> en Francia en 1977.'},{t:'Sus padres eran chilenos.',ok:false},{t:'En 1993 se mudó a Chile.',ok:true,marked:'En 1993 <span class="verb">se mudó</span> a Chile.'},{t:'La música es importante en su vida.',ok:false}]},{label:'',items:[{t:'En 1997 se unió al grupo Makiza.',ok:true,marked:'En 1997 <span class="verb">se unió</span> al grupo Makiza.'},{t:'Su música habla de temas sociales.',ok:false},{t:'En 2006 dejó el grupo Makiza.',ok:true,marked:'En 2006 <span class="verb">dejó</span> el grupo Makiza.'},{t:'Ana es cantante y compositora.',ok:false}]},{label:'',items:[{t:'En 2007 publicó el disco Kaos.',ok:true,marked:'En 2007 <span class="verb">publicó</span> el disco <i>Kaos</i>.'},{t:'Su familia vivía en Francia.',ok:false},{t:'En 2014 publicó el álbum Vengo.',ok:true,marked:'En 2014 <span class="verb">publicó</span> el álbum <i>Vengo</i>.'},{t:'En 2024 publicó el álbum Vida.',ok:true,marked:'En 2024 <span class="verb">publicó</span> el álbum <i>Vida</i>.'}]}];
const all=groups.flatMap(g=>g.items);const selected=new Set();const $=x=>document.getElementById(x);let reviewed=false;
function render(){const holder=$('groups');holder.replaceChildren();let n=0;for(const g of groups){const section=document.createElement('section');section.className='group';for(const item of g.items){const index=all.indexOf(item);const b=document.createElement('button');b.type='button';b.className='sentence'+(selected.has(index)?' selected':'');b.textContent=item.t;b.draggable=true;b.setAttribute('aria-pressed',selected.has(index));b.addEventListener('click',()=>toggle(index));b.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',String(index)));section.append(b)}holder.append(section)}const chosen=$('chosen');chosen.replaceChildren();for(const i of selected){const c=document.createElement('button');c.type='button';c.className='chip'+(reviewed?(all[i].ok?' correct':' incorrect'):'');c.textContent=(reviewed?(all[i].ok?'✓ Correcta · ':'✗ Incorrecta · '):'✕ ')+all[i].t;c.title=reviewed?(all[i].ok?'Acontecimiento correcto. Pulsa para quitarlo.':'No es un acontecimiento concreto. Pulsa para quitarlo.'):'Quitar frase';c.addEventListener('click',()=>toggle(i));chosen.append(c);n++}if(!n){const p=document.createElement('span');p.className='placeholder';p.textContent='Aquí aparecerán las frases seleccionadas…';chosen.append(p)}$('count').textContent=n+' seleccionada'+(n===1?'':'s');if(!reviewed){$('feedback').textContent='';$('explain').classList.remove('visible')}}
function toggle(i){selected.has(i)?selected.delete(i):selected.add(i);reviewed=false;render()}
$('target').addEventListener('dragover',e=>{e.preventDefault();$('target').classList.add('drag-over')});$('target').addEventListener('dragleave',()=>$('target').classList.remove('drag-over'));$('target').addEventListener('drop',e=>{e.preventDefault();$('target').classList.remove('drag-over');const i=Number(e.dataTransfer.getData('text/plain'));if(Number.isInteger(i)&&i>=0&&i<all.length){selected.add(i);reviewed=false;render()}});
$('check').addEventListener('click',()=>{reviewed=true;render();const total=all.filter(a=>a.ok).length;const correct=[...selected].filter(i=>all[i].ok).length;const wrong=[...selected].filter(i=>!all[i].ok).length;const missing=total-correct;$('feedback').textContent=wrong===0&&missing===0?'¡Muy bien! Has encontrado los '+total+' acontecimientos.':'Has encontrado '+correct+' de '+total+' acontecimientos. '+(wrong?'Hay '+wrong+' frase'+(wrong===1?' incorrecta':'s incorrectas')+' marcada'+(wrong===1?'':'s')+' en rojo. ':'')+(missing?'Faltan '+missing+' acontecimiento'+(missing===1?'':'s')+'.':'');const box=$('explain');box.classList.add('visible');if(wrong===0&&missing===0){box.innerHTML='<strong>¿Qué observas?</strong> Estos acontecimientos se presentan como hechos completados en el pasado: '+all.filter(x=>x.ok).map(x=>x.marked).join(' · ')+'<p>Los verbos resaltados están en <b>pretérito indefinido</b>. En cambio, «eran» y «vivía» describen situaciones del pasado; «es» y «habla» describen el presente.</p>'}else{box.textContent='Pista: busca frases que respondan a «¿qué ocurrió?» en un momento concreto, no frases que describen cómo era o es algo.'}});
$('reset').addEventListener('click',()=>{selected.clear();reviewed=false;render()});render();
</script></body></html>
